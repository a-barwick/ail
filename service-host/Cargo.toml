[package]
name = "ail-service-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
ail-compiler = { path = "../compiler/ail-compiler" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
